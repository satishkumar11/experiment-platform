<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Experiment Platform</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; color: #1a1a1a; }
  h1 { font-size: 1.4rem; }
  h2 { font-size: 1.1rem; margin-top: 2.5rem; border-top: 1px solid #eee; padding-top: 1.5rem; }
  label { display: block; margin-top: 0.75rem; font-size: 0.85rem; color: #555; }
  input, textarea { width: 100%; padding: 6px 8px; margin-top: 2px; box-sizing: border-box; font-size: 0.9rem; font-family: inherit; }
  button { margin-top: 12px; padding: 8px 16px; cursor: pointer; }
  pre { background: #f5f5f5; padding: 12px; overflow-x: auto; font-size: 0.85rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 12px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
  .variant-box { border: 1px solid #ddd; border-radius: 6px; padding: 16px; margin-top: 12px; }
  .muted { color: #888; font-size: 0.8rem; }
</style>
</head>
<body>
  <h1>Experiment Platform — Demo</h1>
  <p class="muted">Create an experiment, then simulate a visitor being assigned a variant, exposed, and converted.</p>

  <h2 title="Define the experiment's variants and how traffic should be split between them.">1. Create an experiment</h2>
  <label for="exp-name" title="A short identifier for this experiment, e.g. 'homepage-headline'. Doesn't need to be unique, just descriptive.">Name</label>
  <input id="exp-name" value="homepage-headline" />
  <label for="exp-variants" title="Each variant needs a key and a weight (weights across all variants must add up to 100). Add &quot;is_ai_generated&quot;: true to a variant to have its content written by an LLM when you click Create — the prompt and fallback_content fields only apply to those.">Variants (JSON)</label>
  <textarea id="exp-variants" rows="8">[
  { "key": "control", "weight": 50, "content": "Welcome to our site!" },
  { "key": "ai_variant", "weight": 50, "is_ai_generated": true,
    "prompt": "Write a short, punchy homepage headline for a productivity app.",
    "fallback_content": "Get more done, every day." }
]</textarea>
  <button onclick="createExperiment()" title="Creates the experiment and, for any AI-flagged variant, calls the LLM once to generate its content.">Create experiment</button>
  <pre id="create-out"></pre>

  <h2 title="Pretend to be a visitor: get assigned a variant, then optionally convert.">2. Simulate a visitor</h2>
  <label for="assign-exp-id" title="The experiment to assign this visitor to. Auto-filled after you create one above.">Experiment ID</label>
  <input id="assign-exp-id" />
  <label for="visitor-id" title="A stable ID for this visitor. The same visitor ID always gets the same variant for a given experiment — try reusing one to see stickiness in action.">Visitor ID</label>
  <input id="visitor-id" />
  <button onclick="randomVisitor()" title="Fills in a random visitor ID, as if a new person showed up.">Random visitor</button>
  <button onclick="assignVisitor()" title="Calls GET /assign to pick this visitor's variant, then POST /expose to record that they saw it.">Assign + Expose</button>
  <div id="variant-box" class="variant-box" style="display:none">
    <div id="variant-content"></div>
    <button onclick="convertVisitor()" title="Calls POST /convert to record that this visitor completed the goal, credited to the variant they were shown.">Convert this visitor</button>
    <div id="convert-out" class="muted"></div>
  </div>

  <h2 title="See how each variant is performing so far.">3. Results</h2>
  <label for="results-exp-id" title="The experiment to view results for.">Experiment ID</label>
  <input id="results-exp-id" />
  <button onclick="loadResults()" title="Fetches exposures, conversions, and conversion rate per variant.">Load results</button>
  <table id="results-table" style="display:none">
    <thead><tr><th>Variant</th><th>Exposures</th><th>Conversions</th><th>Conv. rate</th></tr></thead>
    <tbody id="results-body"></tbody>
  </table>

<script>
let currentExperimentId = null;
let currentVisitorId = null;

function randomVisitor() {
  document.getElementById('visitor-id').value = 'visitor_' + Math.random().toString(36).slice(2, 10);
}

async function createExperiment() {
  const name = document.getElementById('exp-name').value;
  const variants = JSON.parse(document.getElementById('exp-variants').value);
  const res = await fetch('/experiments', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, variants })
  });
  const data = await res.json();
  document.getElementById('create-out').textContent = JSON.stringify(data, null, 2);
  if (res.ok) {
    document.getElementById('assign-exp-id').value = data.id;
    document.getElementById('results-exp-id').value = data.id;
  }
}

async function assignVisitor() {
  const experimentId = document.getElementById('assign-exp-id').value;
  const visitorId = document.getElementById('visitor-id').value;
  const res = await fetch(`/assign?visitor_id=${encodeURIComponent(visitorId)}&experiment_id=${encodeURIComponent(experimentId)}`);
  const data = await res.json();
  if (!res.ok) {
    alert(data.detail || 'assignment failed');
    return;
  }
  currentExperimentId = experimentId;
  currentVisitorId = visitorId;

  document.getElementById('variant-box').style.display = 'block';
  document.getElementById('variant-content').innerHTML =
    `<strong>Variant:</strong> ${data.variant_key}<br><strong>Content:</strong> ${data.content ?? '(no content set)'}`;
  document.getElementById('convert-out').textContent = '';

  await fetch('/expose', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ visitor_id: visitorId, experiment_id: experimentId, variant_id: data.variant_id })
  });
}

async function convertVisitor() {
  const res = await fetch('/convert', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ visitor_id: currentVisitorId, experiment_id: currentExperimentId })
  });
  const data = await res.json();
  document.getElementById('convert-out').textContent = 'Recorded: ' + JSON.stringify(data);
}

async function loadResults() {
  const experimentId = document.getElementById('results-exp-id').value;
  const res = await fetch(`/experiments/${experimentId}/results`);
  const data = await res.json();
  if (!res.ok) {
    alert(data.detail || 'failed to load results');
    return;
  }
  const tbody = document.getElementById('results-body');
  tbody.innerHTML = '';
  data.results.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${r.variant_key}</td><td>${r.exposures}</td><td>${r.conversions}</td><td>${(r.conversion_rate * 100).toFixed(1)}%</td>`;
    tbody.appendChild(tr);
  });
  document.getElementById('results-table').style.display = 'table';
}
</script>
</body>
</html>
